<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexa - Detalle de Usuario</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f4f6;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            padding: 30px;
        }

        .header-title {
            background: linear-gradient(90deg, #d500f9, #ff80ab);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .info-group {
            margin-bottom: 15px;
            background: #f9f9fb;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .info-label {
            font-weight: 600;
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 15px;
            color: #333333;
            font-weight: 500;
        }

        .btn-container {
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background: #dcdcdc;
            color: #222222;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #cccccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Detalles del Usuario</div>

        <div class="info-group">
            <div class="info-label">Código</div>
            <div class="info-value" th:text="${usuario.cod_usu}">1</div>
        </div>

        <div class="info-group">
            <div class="info-label">Alias</div>
            <div class="info-value" th:text="${usuario.ali_usu}">Alias</div>
        </div>

        <div class="info-group">
            <div class="info-label">Correo Electrónico</div>
            <div class="info-value" th:text="${usuario.ema_usu}">correo@email.com</div>
        </div>

        <div class="info-group">
            <div class="info-label">Estatus</div>
            <div class="info-value" th:text="${usuario.est_usu == 'A' ? 'Activo (A)' : 'Inactivo (I)'}">Activo</div>
        </div>

        <div class="btn-container">
            <a th:href="@{/usuario_listar}" class="btn"><i class="fa-solid fa-arrow-left"></i> Volver al Listado</a>
        </div>
    </div>

</body>
</html>
