<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado - Rol Fan Page</title>
    <!-- Font Awesome para los iconos de Ver, Editar y Eliminar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #e4e4e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor-tarjeta {
            background: #ffffff;
            width: 100%;
            max-width: 950px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 30px 40px;
        }

        .cabecera-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .cabecera-logo img {
            max-height: 60px;
            object-fit: contain;
        }

        .titulo-solicitud {
            background: linear-gradient(90deg, #d500f9, #ff80ab);
            color: white;
            text-align: center;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            max-width: 420px;
            margin: 0 auto 25px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px  #d500f9, #ff80ab;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .contenedor-tabla {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead tr {
            background: linear-gradient(90deg,  #d500f9, #ff80ab);
            color: white;
        }

        th {
            padding: 12px 15px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        th:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        th:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            text-align: center;
        }

        td {
            padding: 12px 15px;
            font-size: 13px;
            color: #666666;
            border-bottom: 1px solid #f0f0f0;
        }

        tbody tr:hover {
            background-color: #faf3f8;
        }

        tbody td:last-child {
            text-align: center;
            white-space: nowrap;
        }

        .text-center {
            text-align: center;
        }

        .boton-accion-tabla, tbody td:last-child a {
            text-decoration: none;
            font-size: 14px;
            margin: 0 6px;
            display: inline-block;
            color: #666666;
            transition: color 0.2s;
        }

        tbody td:last-child a:hover {
            color: #d500f9;
        }

        .rejilla-botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .boton-accion, .boton-volver, .btn-custom {
            background: linear-gradient(90deg,  #d500f9, #ff80ab);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(184, 53, 149, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            text-align: center;
        }

        .boton-accion:hover, .boton-volver:hover, .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px  #d500f9, #ff80ab;
            color: white;
        }
    </style>
</head>
<body>
    <div class="contenedor-tarjeta">
        <!-- Logo -->
        <div class="contenido-principal">
            <div class="titulo-solicitud">LISTADO DE ROL FAN PAGE</div>
            
            <!-- Mensaje flash de éxito -->
            <div th:if="${mensaje}" class="alert-success" th:text="${mensaje}"></div>

            <!-- Tabla de datos -->
            <div class="contenedor-tabla">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Fan Page</th>
                            <th>Rol</th>
                            <th>Estatus</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Si la lista está vacía -->
                        <tr th:if="${#lists.isEmpty(rolfanpages)}">
                            <td colspan="7" class="text-center">No hay roles de fan page registrados.</td>
                        </tr>
                        <!-- Recorriendo los registros -->
                        <tr th:each="rolfanpage : ${rolfanpages}">
                            <td th:text="${rolfanpage.getCod_rol_fan()}"></td>
                            <td th:text="${rolfanpage.persona.getNm1_per()}"></td>
                            <td th:text="${rolfanpage.persona.getAp1_per()}"></td>
                            <td th:text="${rolfanpage.fan_page.nom_fan_pag}"></td>
                            <td th:text="${rolfanpage.rol.getNom_rol()}"></td>
                            <td th:text="${rolfanpage.getEst_rol_fan()}"></td>
                            <td>
                                <a th:href="@{/rol_fan_page_ver(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" title="Ver"><i class="fa-solid fa-eye"></i></a>
                                <a th:href="@{/rol_fan_page_editar(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" title="Editar"><i class="fa-solid fa-pen-to-square"></i></a>
                                <a th:href="@{/rol_fan_page_eliminar(cod_rol_fan=${rolfanpage.getCod_rol_fan()})}" title="Eliminar" onclick="return confirm('¿Estás seguro de eliminar este registro?');"><i class="fa-solid fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Botones de navegación inferior -->
            <div class="rejilla-botones">
                <a class="boton-accion" th:href="@{/rol_fan_page_agregar}">Nuevo Registro</a>
                <a class="boton-volver" th:href="@{/rol_fan_page}">Volver</a>
            </div>
        </div>
    </div>
</body>
</html>
