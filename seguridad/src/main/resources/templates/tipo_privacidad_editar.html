<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Rol Fan Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .tarjeta-contenedor {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }

        .cabecera-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .contenido-principal {
            width: 100%;
        }

        .titulo-seccion.titulo-solicitud {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .rejilla-formulario {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .campo {
            margin-bottom: 5px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-select {
            width: 100%;
            padding: 12px 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            color: #374151;
            font-size: 0.95rem;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #a855f7;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-guardar {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            transition: opacity 0.2s ease;
        }

        .btn-guardar:hover {
            opacity: 0.9;
        }

        .btn-volver {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            background-color: #e5e7eb;
            color: #374151;
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            background-color: #d1d5db;
        }
    </style>  
    <link rel="stylesheet" th:href="@{/css/tipo_privacidad_editar.css}">
    <title>Conexa - Editar Tipo Privacidad</title>
</head>
<body>
<div class="card">
    <div class="header">
        <h2>conexa</h2>
        <p>Editar Tipo Privacidad</p>
    </div>
    <div class="body">
        <form th:action="@{/tipo_privacidad_editar}" th:object="${tipopriv}" method="post">
            <input type="hidden" th:field="*{cod_tip}">
            <!-- <div class="form-group">
                <label for="cod_tip">Codigo</label>
                <input type="text" id="cod_tip" class="form-control" th:field="*{cod_tip}" disabled>
            </div> -->
            <div class="form-group">
                <label for="nom_tip">Nombre del Tipo Privacidad</label>
                <input type="text" id="nom_tip" th:field="*{nom_tip}" class="form-control" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="est_tip">Estatus</label>
                <select id="est_tip" th:field="*{est_tip}" class="form-control" required>
                    <option value="">Seleccione...</option>
                    <option value="A">Activo</option>
                    <option value="I">Inactivo</option>
                </select>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-pink">Guardar Cambios</button>
                <button type="reset" class="btn btn-pink">Limpiar</button>
                <a th:href="@{/tipo_privacidad_listar}" class="btn btn-gray">Volver</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
