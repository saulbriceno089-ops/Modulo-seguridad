<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- Todo el CSS unificado -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #12002b, #3b0059, #df00ff, #00d4ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contenedor-tarjeta {
            background: rgba(255, 255, 255, 0.05);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .contenedor-tarjeta:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px rgba(223, 0, 255, 0.3), inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .cabecera-logo {
            background: linear-gradient(90deg, #df00ff, #a020f0);
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        .cabecera-logo::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(30deg) translateY(-100%);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(30deg) translateY(-100%); }
            20% { transform: rotate(30deg) translateY(100%); }
            100% { transform: rotate(30deg) translateY(100%); }
        }

        .cabecera-logo img {
            filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.6));
        }

        .contenido-principal {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo-solicitud {
            background: linear-gradient(90deg, #df00ff, #a020f0);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            letter-spacing: 3px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 20px rgba(223, 0, 255, 0.4);
        }

        .rejilla-botones {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        .boton-accion, .boton-volver {
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            padding: 12px 10px;
            border-radius: 15px;
            font-size: 14px;
        }

        .boton-accion::before, .boton-volver::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .boton-accion:hover::before, .boton-volver:hover::before {
            transform: translateX(100%);
        }

        .boton-accion:hover, .boton-volver:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .boton-accion:active, .boton-volver:active {
            transform: translateY(2px) scale(0.95);
        }

        .boton-accion {
            background: linear-gradient(90deg, #df00ff, #a020f0);
            box-shadow: 0 5px 15px rgba(160, 32, 240, 0.3);
        }

        .boton-volver {
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            grid-column: span 2;
        }

        .boton-volver:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Estructura HTML con clases Bootstrap y rutas Thymeleaf -->
    <div class="contenedor-tarjeta">
        <div class="cabecera-logo text-center">
            <img th:src="@{/Imágenes/logo.png}" alt="Logo de la red social" class="img-fluid w-25">
        </div>
        
        <div class="contenido-principal">
            <div class="fw-bold text-uppercase titulo-solicitud mb-4">Seguridad</div>
            
            <div class="rejilla-botones">
                <button class="boton-accion" th:onclick="location.href=[[@{/usuario}]]">Usuario</button>
                <button class="boton-accion" th:onclick="location.href=[[@{/rol}]]">Rol</button>
                <button class="boton-accion" th:onclick="location.href=[[@{/tipo_privacidad}]]">Tipo Privacidad</button>
                <button class="boton-accion" th:onclick="location.href=[[@{/rol_fan_page}]]">Rol Fan Page</button>
                <button class="boton-volver" th:onclick="location.href=[[@{/index}]]">Volver</button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
