spring.application.name=seguridad

#Especifica que se usara el protocolo jdbc:postgresql, el servidor esta en localhost (la misma maquina), el puerto es el 5432 (el puerto estandar de PostgreSQL), y la base de datos a la que se debe conectar es red_social.
spring.datasource.url=jdbc:postgresql://localhost:5433/Red_social

#Configura el nombre de usuario (postgres) que se utilizara para conectarse a la base de datos.
spring.datasource.username=postgres

#Configurar la clae asociada al usario que se utilizara para conectarse a la base de datos.
spring.datasource.password=1234

#Establece el nombre de la aplicacion spring boot como "seguridad".
spring.application.name=seguridad

#Especifica que se debe utilizar el controlador JDBC de PosgreSQL para interactuar con una base de datos, informando a Spring como debe conectarse y comunicarse con una base de datos PostgreSQL especifica.
spring.datasource.driver-class-name=org.postgresql.Driver

#Deshabilita la gestion automatica del esquema de la base de datos por parte de Hibernate. Esto significa que Hibermnate no realizara ninguna operacion de lenguaje de definicion de datos  (DDL) como crear, actualizar o validar tablas al iniciar la aplicacion; el esquema de la base de datos debe ser gestionado manualmente.
spring.jpa.hibernate.ddl-auto=none

#Le dice a Spring y a Hibernate como generar el codigo SQL optimo y las interacciones de persistencia especificas para la base de datos PostgreSQL asegurando que el codigo de la aplicacion pueda interactuar correctamente con ella sin necesidad de cambios.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Consideraciones para produccion:
#En un entorno de produciion, las credenciales (host, usuario, contraseña) no deben estar codificadas directamente en application.properties. 

#En su lugar, se deben utilizar variables de entorno o un sistema de gestion de secretos para cargar estas propiedades.